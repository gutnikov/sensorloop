# The sensorloop skill's evals, which call a model and so cost money. On a pull request that touches the plugin or the
# catalog: whether the skill loads when it should and stays out when it should not. Weekly and by hand: every case,
# the behaviour cases included, which run their fixtures and let the agent write and run commands in a sandbox.
# Needs the repository secret ANTHROPIC_API_KEY; without it the job says so and does nothing.
name: evals

on:
  pull_request:
    paths: ['plugins/claude/**', 'catalog/**']
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: No key, no run
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "The ANTHROPIC_API_KEY secret is not set, so the evals do not run."
      - if: env.ANTHROPIC_API_KEY != ''
        run: npm install -g @anthropic-ai/claude-code@2.1.312
      - name: Loads when it should, and only then
        if: env.ANTHROPIC_API_KEY != '' && github.event_name == 'pull_request'
        run: >-
          claude plugin eval plugins/claude --tag trigger --tag no-trigger --runs 3 --threshold 0.67
          --trust-plugin --no-publish --max-cost-usd 5
      - name: Every case
        if: env.ANTHROPIC_API_KEY != '' && github.event_name != 'pull_request'
        run: >-
          claude plugin eval plugins/claude --runs 3 --threshold 0.67 --trust-plugin --no-publish --scaffold
          --allow-tools Bash Write Edit Agent --max-cost-usd 40
      - if: always() && env.ANTHROPIC_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: plugins/claude/evals/results/
          if-no-files-found: ignore
