# On every pull request and every push to main: the catalog against its schemas and references, the loader's tests,
# a build of the site, and the Claude Code plugin: its copy of the catalog is current, and it and the marketplace are
# valid. Nothing is deployed here, and no model is called.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: The plugin's catalog is the catalog
        run: |
          npm run build:plugin
          if [ -n "$(git status --porcelain -- plugins/claude/skills/sensorloop/catalog)" ]; then
            git status --short -- plugins/claude/skills/sensorloop/catalog
            echo "plugins/claude/skills/sensorloop/catalog is out of date: run npm run build:plugin and commit it."
            exit 1
          fi
      - name: The plugin and the marketplace are valid
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.312
          claude plugin validate plugins/claude
          claude plugin validate .
