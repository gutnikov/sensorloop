title: CLI tool author
who: |
  I write and maintain a command-line tool in Go, alone. It's distributed through Homebrew, GitHub releases and a
  curl | sh install script. GitHub Actions builds and tests it on Linux, macOS and Windows. I have a decent test suite
  that runs in under a minute. I review my own PRs, which means I mostly don't. I hand tasks to Claude Code and come
  back later. Model calls on my machine are fine; not in CI. What hurts: a release that installs but crashes on
  start, or output that changes and breaks people's scripts that parse it.
expect:
  must: [approved-fixtures, agentic-manual-testing, shipped-artifact-check, ci-clean-infra]
  must_not: [preview-environments, e2e-browser, lighthouse-ci, dast]
answers:
  product: [library]
  path: [ci, installed]
  observe: [feedback]
  agent: [handoff]
  review: me
  risk: [clients, irreversible]
  tests: [some]
  budget: local
