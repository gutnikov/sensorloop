title: Solo SaaS, laptop only
who: |
  I'm a solo developer. I build a small B2B SaaS: a React front end, a Node API, and Postgres. Everything runs on my
  personal laptop. There is no CI: I run things locally and deploy by hand, with a script that rsyncs to one VPS and
  restarts the service. About 40 paying customers use it. I have a handful of unit tests that run in a few seconds. I
  don't have Sentry or log search; when something breaks, a customer emails me. I work with Claude Code in a session
  and watch what it does. My budget is tight: I pay for my own Claude subscription and don't want anything else
  calling models. The scary part is the production database: one bad migration and customer data is gone.
expect:
  must: [run-tests-first, type-check-and-build, lint-with-fix-instructions, risky-action-gates, db-migration-lint, secret-scanning, e2e-browser]
  must_not: [preview-environments, load-testing, dast, ci-clean-infra, structured-logs, traces-opentelemetry, release-confirmation]
answers:
  product: [web, backend]
  path: [servers, migrations]
  observe: [feedback]
  agent: [watched]
  review: me
  risk: [data, attack]
  tests: [some]
  budget: no
