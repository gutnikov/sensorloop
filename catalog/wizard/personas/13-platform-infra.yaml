title: Platform and infrastructure engineer
who: |
  I'm a platform engineer. My team owns the AWS infrastructure for the whole company: Terraform for the cloud
  resources, Helm charts and ArgoCD for Kubernetes, and the GitHub Actions workflows other teams use. Every PR runs
  terraform plan in CI and needs a review from someone on my team. We have staging and production accounts, CloudWatch
  and Grafana. We run an agent in GitHub Actions that updates provider versions and fixes drift; locally we hand it
  tasks. Model calls are fine anywhere. What hurts: a terraform apply that destroys a production database or opens a
  security group to the world, and a broken config taking everything down.
expect:
  must: [config-validation, risky-action-gates, plan-approval, agent-ci-hardening, secret-scanning, backup-restore-rollback, health-checks-smoke]
  must_not: [e2e-browser, lighthouse-ci]
answers:
  product: [infra]
  path: [ci, staging, servers]
  observe: [logs, metrics, alerts]
  agent: [handoff, ci]
  review: team
  risk: [data, irreversible, attack]
  tests: [none]
  budget: anywhere
