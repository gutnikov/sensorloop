title: High-traffic e-commerce
who: |
  I'm a senior engineer at an online retailer. The storefront is Next.js, with a Node API, Postgres and Redis, and
  payments through a payment provider. Traffic peaks on Black Friday at about 50 times normal. GitHub Actions runs our
  tests on each PR, which get a review from a teammate; we have staging and production but no per-PR previews. We use
  Datadog for logs, metrics and traces, and Sentry. We use Claude Code watched and for handed-off tasks; model calls
  are allowed in CI. What hurts: checkout breaking or getting slow, the payment provider timing out, page speed
  dropping our search ranking, and attacks on the shop.
expect:
  must: [load-testing, lighthouse-ci, fault-injection, release-confirmation, dast, error-tracking, health-checks-smoke]
  must_not: []
answers:
  product: [web, backend]
  path: [ci, staging, servers, migrations]
  observe: [errors, logs, metrics, traces, alerts]
  agent: [watched, handoff]
  review: team
  risk: [money, load, pages, attack, deps]
  tests: [some]
  budget: anywhere
