title: Data and analytics engineer
who: |
  I'm a data engineer on a team of four. We write Python and SQL: dbt models and Airflow DAGs over BigQuery. There's no
  user interface; our output is tables that feed dashboards the board looks at every week. GitLab CI runs dbt tests
  and a few pytest tests on each merge request, and a teammate reviews it. We have dev and prod BigQuery projects. A
  full refresh or a backfill of a big model costs real money, and a wrong number in the board dashboard is a very bad
  day. Alerts from failed DAG runs go to Slack. We use Claude Code in sessions, watched. Model calls are fine locally.
expect:
  must: [run-tests-first, config-validation, approved-fixtures, risky-action-gates]
  must_not: [e2e-browser, lighthouse-ci, load-testing, preview-environments]
answers:
  product: [data]
  path: [ci, servers]
  observe: [alerts]
  agent: [watched]
  review: team
  risk: [money, wrong, clients]
  tests: [some]
  budget: local
