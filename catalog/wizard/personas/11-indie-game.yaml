title: Indie game developer
who: |
  I'm a solo indie game developer. I make a game in Unity with C#, for PC, sold on Steam. I have almost no automated
  tests; I playtest by hand, and a few friends test beta builds. I upload builds to Steam through a script. No CI,
  no servers. I use Claude Code while I watch it, mostly for gameplay code and editor tools. I don't want to pay for
  extra model calls. Worst case: a Steam update that crashes on start for players, or corrupts their save files.
expect:
  must: [type-check-and-build, result-demo, observe-and-interrupt, shipped-artifact-check]
  must_not: [e2e-browser, lighthouse-ci, preview-environments, dast, load-testing]
answers:
