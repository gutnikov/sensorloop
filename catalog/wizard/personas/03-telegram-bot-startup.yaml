title: Startup Telegram bot
who: |
  We are three developers at a startup. Our product is a Telegram bot written in Python with aiogram, with Postgres and
  Redis, running in Docker on one VPS. GitHub Actions runs our pytest suite on each PR (a couple of hundred tests, a
  few minutes) and deploys main to the VPS. Part of the bot's replies are written by an LLM (we call Claude through the
  API), with a few prompts that we change often. Users send feedback and feature requests right in the chat, and we
  have Sentry. We review each other's PRs. We use Claude Code in sessions, sometimes letting it run a task while we do
  something else. We're fine paying for model calls in CI if they're useful. The bot can broadcast a message to all
  50k users at once, which would be a disaster if done by mistake.
expect:
  must: [llm-evals, scripted-model-tests, approved-fixtures, error-tracking, health-checks-smoke, user-feedback, risky-action-gates]
  must_not: []
answers:
  product: [bot, llm]
  path: [ci, servers, migrations]
  observe: [errors, feedback]
  agent: [watched, handoff]
  review: team
  risk: [data, irreversible, wrong]
  tests: [some]
  budget: anywhere
