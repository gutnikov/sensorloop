title: Mobile app team
who: |
  I lead a team of six mobile developers. We build native apps: Kotlin for Android, Swift for iOS. The backend belongs
  to another team; we only consume its API. We ship through the App Store and Google Play every two weeks, with staged
  rollouts, and watch the crash rate in Firebase Crashlytics. Our CI (Bitrise) runs unit tests and screenshot snapshot
  tests on every PR, and every PR gets a review from a teammate. Tests take about 15 minutes and are mostly reliable.
  We use Claude Code locally, watched, and the company allows model calls only on our machines. What hurts most: a
  broken release that's already on phones, because we can't pull it back, and old app versions that stay in the wild
  for months.
expect:
  must: [type-check-and-build, approved-fixtures, result-demo, shipped-artifact-check, release-confirmation, error-tracking]
  must_not: [preview-environments, dast, e2e-browser, lighthouse-ci]
answers:
  product: [app]
  path: [ci, installed]
  observe: [errors, feedback]
  agent: [watched]
  review: team
  risk: [irreversible, clients]
  tests: [slow]
  budget: local
