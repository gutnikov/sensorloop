title: Open-source library maintainer
who: |
  I maintain an open-source TypeScript library on npm with about 2 million weekly downloads. GitHub Actions runs the
  tests on a matrix of Node versions and operating systems. Contributors open PRs from forks, and I review every one
  of them; a co-maintainer helps sometimes. There is no deploy, only npm releases. The test suite is good: fast, and I
  trust it. I use Claude Code locally on tasks I hand off, and an agent in GitHub Actions labels and answers new
  issues. I can spend some money on model calls in CI. What hurts most: a release that breaks users' builds or
  changes the public API by accident, and a compromised dependency.
expect:
  must: [api-breaking-changes, shipped-artifact-check, mutation-testing, human-diff-review, triage, agent-ci-hardening, text-from-a-brief]
  must_not: [preview-environments, load-testing, structured-logs, health-checks-smoke]
answers:
  product: [library]
  path: [ci, installed]
  observe: [feedback]
  agent: [handoff, ci]
  review: team
  risk: [clients, irreversible, supply]
  tests: [some, strong]
  budget: anywhere
