title: Legacy monolith
who: |
  We're a team of five maintaining a twelve-year-old Ruby on Rails monolith with MySQL. Deploys go through Capistrano
  to a few servers. CircleCI runs a 40-minute test suite that is flaky, and main is red more often than we'd like.
  Honeybadger reports errors and we have Papertrail logs. Every PR gets a review. We use Claude Code watched, and
  sometimes hand off small bugs. Model calls are fine locally. What hurts: data in MySQL, migrations on big tables,
  and changing old code nobody fully understands.
expect:
  must: [run-tests-first, bug-failing-test-fix, approved-fixtures, db-migration-lint, error-tracking, ci-clean-infra]
  must_not: []
answers:
  product: [web]
  path: [ci, staging, servers, migrations]
  observe: [errors, logs]
  agent: [watched, handoff]
  review: team
  risk: [data, legacy]
  tests: [slow, flaky]
  budget: local
