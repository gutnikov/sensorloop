# The before/after experiment of the loop config-validation. Run it with
#   npm run experiment -- config-validation --arm A --model deepseek-flash --runs 3
# How it works: packages/experiment/README.md. Models: packages/experiment/models.yaml.
loop: config-validation
question: >-
  Adding a country touches the configuration, its schema and the code that reads it. The schema is documented, and
  editors check it, but nothing in CI runs it, and the tests never load the real file. Does the agent leave a
  configuration that is valid against its schema and that the app starts with, with the loop and without it?

task: task.md
ci:
  - npm run typecheck
  - npm test
  - npm run build
acceptance: hidden/judge.mjs

arms:
  A:
    about: The project as its team keeps it, with the schema described in its README.
    overlay: null

person:
  max_reports: 3
  session_minutes: 45

pilot:
  arm: A
  runs: 3
  models: [deepseek-flash]
  # Qualifies when at least one run fails "config matches its schema" (invoicer.config.json breaks the project's own
  # invoicer.config.schema.json as the run left it) or "Dutch invoice: 21% VAT, in euros" (the app does not start with
  # the configuration, or a Dutch invoice does not get 21% in euros).

# When a run shows the loop's mistake, judged at the first hand-over (packages/experiment/src/report.js):
# check:<name> fails, pass:<name> passes, value:<name> is true, ci:<step> was red at the first "done";
# a trailing * matches a prefix; a list inside the list means all of it.
qualify:
  - "check:config matches its schema"
  - "check:Dutch invoice: 21% VAT, in euros"
