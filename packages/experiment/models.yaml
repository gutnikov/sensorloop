# The models an experiment can run on, by the name the runner takes (--model). An experiment's experiment.yaml may add
# or override entries. env is what Claude Code gets; ${VAR} comes from the credential file, which stays outside the
# repository and reaches the container only at run time.
#
# Effort is Claude Code's default, `high`, as a person runs it (from 2026-11-15; the first pilots ran at `max`, as
# DeepSeek's guide for Claude Code recommends).
deepseek-flash:
  credentials: ~/.config/sensorloop/deepseek.env
  env: &deepseek
    ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
    ANTHROPIC_AUTH_TOKEN: ${DEEPSEEK_API_KEY}
    ANTHROPIC_MODEL: deepseek-flash[1m]
    ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek-flash[1m]
    ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-flash[1m]
    ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-flash
    CLAUDE_CODE_SUBAGENT_MODEL: deepseek-flash
    CLAUDE_CODE_EFFORT_LEVEL: high
    CLAUDE_CODE_AUTO_COMPACT_WINDOW: '786432'
deepseek-v4-pro:
  credentials: ~/.config/sensorloop/deepseek.env
  env:
    <<: *deepseek
    ANTHROPIC_MODEL: deepseek-v4-pro[1m]
    ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek-v4-pro[1m]
    ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-v4-pro[1m]
glm-5.3-flash:
  credentials: ~/.config/sensorloop/glm.env
  env:
    ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
    ANTHROPIC_AUTH_TOKEN: ${GLM_API_KEY}
    ANTHROPIC_MODEL: glm-5.3-flash
    ANTHROPIC_DEFAULT_OPUS_MODEL: glm-5.3-flash
    ANTHROPIC_DEFAULT_SONNET_MODEL: glm-5.3-flash
    ANTHROPIC_DEFAULT_HAIKU_MODEL: glm-5.3-flash
    CLAUDE_CODE_SUBAGENT_MODEL: glm-5.3-flash
    CLAUDE_CODE_EFFORT_LEVEL: high
